# Induced failures for the recovery evaluation.
#
# Times are seconds from mission start, chosen so each fault lands while the
# robot is mid-leg rather than parked at a waypoint — a fault injected during a
# 2 s pick dwell provokes nothing.
#
# Scheduled by time, not by robot position, so the run stays reproducible. If
# faults fired on position, a robot that recovered differently would meet the
# next fault in a different state and the comparison between runs would be
# meaningless.
#
# Ordered least to most severe, deliberately. The kidnap is not survivable with
# random-particle injection disabled (see docs/parameter-rationale.md), so a run
# reaches it and ends. Anything scheduled after it never fires. The sensor
# dropout used to sit at 120 s, behind the kidnap, and had never once run.

faults:
  # 1. Drop a pallet into the aisle ahead of the robot on its first leg.
  #    Expect: replan, then a local costmap clear if the plan stays invalid.
  #    y is 0.45, not 0. A 0.8 m pallet dropped dead centre leaves a zero-cost
  #    lane 0.06 m wide, which is not a replanning test — it is an impassable
  #    aisle, and the robot correctly gave up. Offset, it leaves 0.51 m, which
  #    is the "plan around it" case this fault is meant to exercise.
  #    The model is fault_pallet, the dynamic prop parked outside the building:
  #    gz-sim does not move a static model's collision or visual on set_pose,
  #    so the Classic choice of aisle_pallet_0 would teleport nothing a sensor
  #    can see. See FAULT_PALLET_* in simulation/generate_world.py.
  - {at: 12.0, type: block_aisle, model: fault_pallet, x: -6.0, y: 0.45, z: 0.475}

  # 2. Wrong pose exactly one racking bay (2.7 m) from truth. This is the
  #    aliasing case: the scan matches the wrong bay perfectly, so nothing local
  #    can detect it and only AMCL's global map can pull it back.
  - {at: 35.0, type: localisation_jump, x: 1.35, y: 0.0, yaw: 0.0}

  # 3. Blind the LiDAR mid-aisle. The injector publishes to scan_relay/blind
  #    and restores on a timer; run_faults.sh puts the relay in the path with
  #    use_scan_relay:=true. AMCL then has no measurement and has to coast on
  #    odometry, which is the point of the fault.
  - {at: 55.0, type: sensor_dropout, duration: 4.0}

  # 4. Physically move the robot without telling anything. Harder than the
  #    pose jump, because the estimate is right and the world is wrong. This is
  #    the one the stack is not expected to survive.
  - {at: 75.0, type: kidnap, model: warehouse_amr, x: 5.4, y: 0.0, z: 0.0}

  # 5. Force a full global relocalisation and time how long reconvergence takes
  #    in a space where every bay looks alike. This is the manual substitute for
  #    the automatic particle injection that is disabled on measured evidence.
  - {at: 95.0, type: relocalise}
