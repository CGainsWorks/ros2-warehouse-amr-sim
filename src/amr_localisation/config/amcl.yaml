# AMCL. Owns map -> odom; the EKF owns odom -> base_link.
#
# The single most important thing about this file is that AMCL's odometry input
# is the EKF output, not raw wheel odometry. That changes what the alpha motion
# noise parameters should be: they describe the noise of the odometry source
# AMCL is given, and the EKF's output is markedly better than the encoders alone
# because it has already had the IMU and the scan matcher applied to it. Leaving
# the alphas at values tuned for raw encoders makes the particle cloud far more
# diffuse than the evidence warrants, which shows up as a pose that wanders
# within a spread it should not have.

amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    # -----------------------------------------------------------------
    # Motion model. Differential drive. alpha1/alpha2 are rotation noise from
    # rotation and from translation; alpha3/alpha4 are translation noise from
    # translation and from rotation; alpha5 is strafe, nominally zero for a
    # non-holonomic base but left small so the filter can represent a robot
    # shoved sideways by a pallet truck.
    # -----------------------------------------------------------------
    # NARROW, and an attempt to widen them was measured and rejected.
    #
    # The open-loop harness showed AMCL tracking well in translation (under
    # 1.5 degrees of yaw error, 0.06 m of position error over 20 s) and then
    # breaking during the first in-place 180 degree turn, ending 60-70 degrees
    # out and never recovering. The obvious reading was that the proposal
    # distribution was too narrow for the laser to correct the filter, so
    # alpha1/alpha2 were raised to 0.20, max_beams to 240 and gentle recovery
    # injection re-enabled.
    #
    # That made it far worse: ATE went from 1.32 m to 12.47 m and yaw error from
    # 51 to 131 degrees. A wide proposal in a corridor whose racking repeats
    # every 2.7 m simply gives the filter more wrong hypotheses to find, and
    # injected particles latch onto them. The narrow values are restored.
    #
    # Three parameters were changed at once, which is why the result only says
    # "that combination is worse" and not which one did the damage. The rotation
    # failure is therefore still open; see docs/localisation-accuracy.md.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    # -----------------------------------------------------------------
    # Sensor model.
    #
    # likelihood_field over beam: the beam model has to ray-trace every beam
    # against the map for every particle, which at 2000 particles does not fit
    # in a 10 Hz budget. The likelihood field precomputes an obstacle distance
    # map once and reduces each beam to a lookup. The beam model's advantage is
    # that it models unexpected obstacles explicitly, which matters in a corridor
    # full of people; the likelihood field handles that adequately via z_rand and
    # by capping max_beams.
    # -----------------------------------------------------------------
    laser_model_type: "likelihood_field"

    # z_hit + z_rand = 1.0. 0.5/0.5 is a deliberately conservative split for a
    # warehouse: half the weight allows for a return that the static map cannot
    # explain, because a large fraction of what the LiDAR sees — pallets in the
    # aisle, people, a parked forklift — genuinely is not in the map. Pushing
    # z_hit towards 0.9, which is common for tidy corridors, makes the filter
    # over-penalise particles for observing real but unmapped objects.
    z_hit: 0.5
    z_rand: 0.5
    # Unused by likelihood_field but read at startup; left at library defaults.
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    # Standard deviation of the Gaussian on the obstacle distance, metres.
    # Roughly the map resolution (0.05 m) times four: wide enough to tolerate the
    # discretisation of the occupancy grid and small map-vs-world discrepancies,
    # narrow enough to still discriminate between adjacent racking bays.
    sigma_hit: 0.2

    # Distance beyond which the likelihood field is not computed. 2.0 m keeps
    # the precomputed field small; beyond that the likelihood is flat anyway.
    laser_likelihood_max_dist: 2.0

    laser_min_range: 0.10
    # Deliberately below the sensor's 25 m maximum. Long returns down a 30 m
    # aisle are the least informative beams in the scan — they hit the far wall,
    # which every particle along the aisle agrees about — and they are the most
    # affected by small yaw errors. Capping at 20 m spends the beam budget on
    # nearer structure that actually discriminates between hypotheses.
    laser_max_range: 20.0

    # 240 of the 720 beams, evenly subsampled. Adjacent beams in a 720-beam scan
    # are highly correlated — they usually hit the same surface — so using all
    # of them inflates confidence without adding information.
    #
    # 240 was tried alongside the wider alphas and the combination was much
    # worse; 120 is restored with them. 120 beams at 0.5 degree effective
    # spacing still resolves a 0.1 m racking upright at 11 m.
    max_beams: 120

    # -----------------------------------------------------------------
    # Particle filter.
    # -----------------------------------------------------------------
    # 500-2000 adaptive. The lower bound is what is needed to track a converged
    # pose in a 30 x 12 m space; the upper bound is what global localisation
    # needs when the initial pose is unknown, and is where the filter sits for
    # the first few seconds after a relocalisation request.
    min_particles: 500
    max_particles: 2000

    # KLD sampling bounds, controlling how aggressively the particle count is
    # reduced once the cloud converges.
    pf_err: 0.05
    pf_z: 0.99

    # Resample every filter update. The alternative, resampling less often,
    # reduces particle depletion but this filter already has recovery_alpha
    # injection for that, and the aisle is repetitive enough that delayed
    # resampling lets wrong hypotheses persist.
    resample_interval: 1

    # Update only after real motion. 0.2 m / 0.2 rad. Updating on a stationary
    # robot repeatedly resamples the same measurement and artificially collapses
    # the particle cloud, producing a confident pose with no new evidence behind
    # it.
    update_min_d: 0.20
    # 0.1 rad rather than 0.2. Rotation is where this filter was losing itself,
    # and the update threshold sets how many chances the laser gets to correct
    # it: at 0.2 rad a 180 degree turn allows about 16 updates, at 0.1 rad about
    # 31. Halving it does not risk the collapse that motivates a threshold at
    # all, because that comes from updating a STATIONARY robot, which is still
    # excluded by update_min_d.
    update_min_a: 0.10

    # -----------------------------------------------------------------
    # Recovery: random particle injection, DISABLED.
    #
    # Enabled at the textbook 0.001 / 0.1 it fired during startup, before either
    # average had converged, and threw the filter into a wall: 9.8 m^2 variance
    # on the first published pose from a known start, diverging to 31 m^2 within
    # six seconds.
    #
    # A gentler 0.001 / 0.02 was then tried, on the reasoning that a filter which
    # locks onto a wrong hypothesis during a turn needs some way back. Measured
    # alongside the wider alphas it was much worse, and both were reverted
    # together. Injection remains off.
    #
    # The kidnapped-robot case is handled explicitly through
    # /reinitialize_global_localization, which the fault injector calls, and
    # which is controllable and observable rather than firing on its own.
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # How far into the future the map -> odom transform is post-dated. Must
    # exceed the interval between AMCL updates or consumers will intermittently
    # find the transform expired. 1.0 s covers the worst case of a robot moving
    # slowly enough that update_min_d takes a while to trigger.
    transform_tolerance: 1.0

    # Publish map -> odom continuously rather than only on update, so that TF
    # consumers see a valid tree between AMCL updates.
    tf_broadcast: true

    # Seeded from the launch file to match the robot's spawn pose in Gazebo.
    # Global localisation is exercised separately by the induced-failure runs in
    # scripts/run_faults.sh, which call /reinitialize_global_localization.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: -12.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Beams within this angle of each other are considered redundant. Zero
    # disables the check; the subsampling in max_beams already handles it.
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    save_pose_rate: 0.5
