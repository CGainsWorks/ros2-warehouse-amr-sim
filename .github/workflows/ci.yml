name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline job is the important one. It runs the real algorithms — RANSAC
  # ground removal, Euclidean clustering, ICP scan matching, the error metrics —
  # against the ray-traced warehouse scene, with no ROS and no simulator. It
  # takes seconds and it reproduces every number the README quotes about
  # segmentation and scan-matching accuracy.
  offline:
    name: Offline checks (no ROS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # matches ROS 2 Humble's Python
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pyyaml pytest flake8

      - name: Lint
        # No flags: the settings live in .flake8, so this job and `make lint`
        # cannot drift from it. They had drifted -- both passed
        # --max-line-length=110 over a config file that says 120, so this step
        # was failing on 24 pre-existing lines while `make lint` reported success,
        # because it passed the same override and ended in `|| true`.
        run: flake8 src/ analysis/ tests/ simulation/
      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Generated files are up to date
        # The world, zone definitions and reference map are generated from one
        # set of constants and committed. If a generator change is pushed
        # without regenerating, the simulated warehouse and the scene the
        # offline metrics measure quietly stop being the same place.
        run: |
          python simulation/generate_world.py
          if ! git diff --exit-code --stat simulation/; then
            echo "::error::simulation/ is stale. Run 'make world' and commit the result."
            exit 1
          fi

      - name: Segmentation metrics
        run: python analysis/segmentation_metrics.py --scans 25 --output results/segmentation.json

      - name: Scan odometry benchmark
        run: python analysis/scan_odometry_benchmark.py --output results/scan_odometry.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: offline-metrics
          path: results/
          retention-days: 30

  # Verifies the ROS packages build and the launch files parse. It does not run
  # Gazebo: a headless simulation in CI is slow, flaky on shared runners, and
  # would test the runner's graphics stack as much as this code. The end-to-end
  # localisation numbers come from `make eval` on a real machine, and
  # docs/localisation-accuracy.md says so.
  build:
    name: colcon build (ROS 2 Humble)
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep \
            python3-numpy python3-scipy python3-yaml \
            ros-humble-navigation2 ros-humble-nav2-bringup \
            ros-humble-robot-localization \
            ros-humble-cartographer-ros \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-xacro
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys "gazebo libgazebo-dev" || true

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Xacro expands to valid URDF
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro src/amr_description/urdf/amr.urdf.xacro > /tmp/amr.urdf
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/amr.urdf')"
          test -s /tmp/amr.urdf

      - name: Launch files import cleanly
        shell: bash
        # Catches the common failure of a launch file that only breaks at
        # runtime because of a typo'd substitution or a missing import.
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          for f in $(find src -name '*.launch.py'); do
            echo "checking $f"
            python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('lf', '$f')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, 'generate_launch_description'), '$f has no generate_launch_description'
          mod.generate_launch_description()
          "
          done
